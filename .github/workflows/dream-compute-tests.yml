name: DREAM COMPUTE checks

on:
  push:
    branches: [dream-compute-platform]
    paths:
      - "dream-compute-source.part*"
      - "dream-compute/worker.py"
      - "dream-compute/README.md"
      - "model/**"
      - "training/dream_ai_adapter_self_train_kaggle.ipynb"
      - "training/dream_train_colab.ipynb"
      - ".github/workflows/dream-compute-tests.yml"
  pull_request:
    branches: [dream-compute-platform]

concurrency:
  group: dream-compute-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-and-training-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile the provider-independent worker
        run: python -m py_compile dream-compute/worker.py
      - name: Validate self-training notebook and checkpoint safety
        run: python -m unittest model.test_adapter_self_train_notebook model.test_training_notebook

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract the exact source bundle deployed to Render
        run: |
          cat dream-compute-source.part* | base64 -d | tar -xz
      - name: Install control-plane dependencies
        run: npm --prefix dream-compute install
      - name: Test queue, completion, model matching and worker recovery
        run: npm --prefix dream-compute test
