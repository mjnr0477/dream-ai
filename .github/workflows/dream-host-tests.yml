name: DREAM HOST integration checks

on:
  pull_request:
    branches:
      - dream-host-runtime
    paths:
      - "dream-host/**"
      - "package.json"
      - "lib/**"
      - "scripts/**"
  push:
    branches:
      - dream-host-runtime
    paths:
      - "dream-host/**"
      - "package.json"
      - "lib/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  test:
    name: Node 20 validation and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies without running lifecycle scripts
        run: npm install --ignore-scripts
      - name: Run repository and DREAM HOST checks
        run: |
          npm test
          node --check dream-host/server.js
          node --check dream-host/notebook-core.js
          node --test dream-host/*.test.js
          python -m py_compile dream-host/notebook_worker.py
