name: DREAM AI autonomous training trigger

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *' # Daily at 04:17 EAT (UTC+3)

permissions:
  contents: read

concurrency:
  group: dream-ai-autonomous-training
  cancel-in-progress: false

jobs:
  launch-reviewed-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out DREAM AI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-test the autonomous launcher
        run: python scripts/launch_dream_ai_kaggle.py --check

      - name: Install Kaggle CLI and its compatibility dependency
        run: python -m pip install --disable-pip-version-check 'kaggle>=2.2.5,<3' 'six>=1.10.0'

      - name: Check readiness and launch a reviewed training cycle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DREAM_AI_KAGGLE_DATASET: ${{ vars.DREAM_AI_KAGGLE_DATASET }}
        run: python scripts/launch_dream_ai_kaggle.py
