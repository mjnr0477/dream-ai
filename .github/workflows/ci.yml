name: Dream AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: dream-ai-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run application tests
        run: npm test

  reasoning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile reasoning package
        run: python -m compileall -q reasoning
      - name: Test reasoning planner and structured-plan adapter
        run: python -m unittest discover -s reasoning -p 'test_*.py' -v

  native-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r model/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q model
      - name: Compile corpus importers
        run: >-
          python -m py_compile
          data/import_oasst1_candidates.py
          data/import_oasst1_sft_candidates.py
      - name: Compile DREAM opt-in pipeline tools
        run: >-
          python -m py_compile
          data/dream_ai_optin_pipeline.py
          data/export_dream_ai_optins.py
          data/prepare_dream_ai_sft_splits.py
          data/verify_dream_ai_sft_audits.py
          data/sync_dream_ai_reviews_to_supabase.py
          scripts/prepare_dream_ai_autotraining.py
          scripts/manage_dream_ai_autotraining_run.py
      - name: Compile multilingual corpus exporter
        run: python -m py_compile data/export_fineweb2_sample.py
      - name: Test opt-in learning export and SFT split gates
        run: python -m unittest discover -s data -p 'test_dream_ai_optin_pipeline.py' -v
      - name: Test SFT privacy audit release gate
        run: python -m unittest discover -s data -p 'test_dream_ai_sft_audit_gate.py' -v
      - name: Estimate DREAM model parameter and memory budget
        run: python model/estimate_model.py --out /tmp/dream-model-budget.json
      - name: Validate training notebook structure and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for notebook in (
              Path("training/dream_train_colab.ipynb"),
              Path("training/dream_train_kaggle.ipynb"),
              Path("training/dream_ai_adapter_self_train_kaggle.ipynb"),
              Path("training/auto-train-kernel/dream_ai_auto_train.ipynb"),
          ):
              document = json.loads(notebook.read_text(encoding="utf-8"))
              assert document["nbformat"] == 4 and document["cells"]
              for index, cell in enumerate(document["cells"]):
                  assert cell["cell_type"] in ("code", "markdown")
                  if cell["cell_type"] == "code":
                      compile("".join(cell["source"]), f"{notebook}:cell-{index}", "exec")
              print(f"Validated notebook structure and Python syntax: {notebook}")
          PY
      - name: Test DREAM transformer, runtime and release gate
        run: python -m unittest discover -s model -p 'test_*.py' -v
      - name: Prepare synthetic pretraining smoke corpus
        run: python model/prepare_corpus.py --input data/smoke-test.jsonl --output /tmp/dream-smoke-data
      - name: Train a tiny DREAM checkpoint from random initialization
        run: >-
          python model/train.py
          --data /tmp/dream-smoke-data/train.txt
          --validation-data /tmp/dream-smoke-data/validation.txt
          --corpus-manifest /tmp/dream-smoke-data/manifest.json
          --out /tmp/dream-smoke-small.pt
          --steps 2 --batch-size 2 --grad-accum-steps 1
          --block-size 32 --d-model 16 --layers 1 --heads 4
          --eval-every 1 --checkpoint-every 2 --eval-batches 1
      - name: Audit native DREAM pretraining checkpoint before evaluation
        run: python model/audit_checkpoint.py --checkpoint /tmp/dream-smoke-small.pt --out /tmp/dream-smoke-checkpoint-audit.json
      - name: Evaluate native DREAM checkpoint on held-out test split
        run: >-
          python model/evaluate.py
          --checkpoint /tmp/dream-smoke-small.pt
          --data /tmp/dream-smoke-data/test.txt
          --batch-size 1 --batches 1 --sample-tokens 8
          --out /tmp/dream-smoke-eval.json
      - name: Evaluate each language independently on held-out pretraining data
        run: >-
          python model/evaluate_multilingual.py
          --checkpoint /tmp/dream-smoke-small.pt
          --manifest /tmp/dream-smoke-data/manifest.json
          --batch-size 1 --batches 1 --sample-tokens 0
          --out /tmp/dream-smoke-multilingual-eval.json
      - name: Cross-check checkpoint audit and held-out evaluation
        run: >-
          python model/validate_release.py
          --checkpoint /tmp/dream-smoke-small.pt
          --audit /tmp/dream-smoke-checkpoint-audit.json
          --evaluation /tmp/dream-smoke-eval.json
          --out /tmp/dream-smoke-release-gate.json
      - name: Audit synthetic SFT splits and create a hash-bound manifest
        run: |
          python model/audit_corpus.py --input data/sft-smoke-train.jsonl --out /tmp/dream-smoke-sft-train-audit.json
          python model/audit_corpus.py --input data/sft-smoke-validation.jsonl --out /tmp/dream-smoke-sft-validation-audit.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def split(path):
              raw = Path(path).read_bytes()
              return {
                  "records": sum(1 for line in raw.splitlines() if line.strip()),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }

          train = split("data/sft-smoke-train.jsonl")
          validation = split("data/sft-smoke-validation.jsonl")
          dataset_hash = hashlib.sha256(
              Path("data/sft-smoke-train.jsonl").read_bytes()
              + Path("data/sft-smoke-validation.jsonl").read_bytes()
          ).hexdigest()
          manifest = {
              "schema": "dream-sft-splits-v1",
              "dataset_sha256": dataset_hash,
              "splits": {"train": train, "validation": validation},
          }
          Path("/tmp/dream-smoke-sft-manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          PY
          python data/verify_dream_ai_sft_audits.py \
            --manifest /tmp/dream-smoke-sft-manifest.json \
            --train-audit /tmp/dream-smoke-sft-train-audit.json \
            --validation-audit /tmp/dream-smoke-sft-validation-audit.json \
            --output /tmp/dream-smoke-sft-audit-gate.json
      - name: Fine-tune DREAM on synthetic assistant-only examples
        run: >-
          python model/sft.py
          --checkpoint /tmp/dream-smoke-small.pt
          --train-data data/sft-smoke-train.jsonl
          --validation-data data/sft-smoke-validation.jsonl
          --sft-audit-gate /tmp/dream-smoke-sft-audit-gate.json
          --pretraining-manifest /tmp/dream-smoke-data/manifest.json
          --pretraining-test-data /tmp/dream-smoke-data/test.txt
          --out /tmp/dream-smoke-instruct.pt
          --steps 2 --batch-size 1 --grad-accum-steps 1
          --learning-rate 0.0001 --eval-every 1
          --eval-batches 1 --checkpoint-every 2
      - name: Audit native DREAM instruction checkpoint before evaluation
        run: python model/audit_checkpoint.py --checkpoint /tmp/dream-smoke-instruct.pt --out /tmp/dream-smoke-instruct-checkpoint-audit.json
      - name: Evaluate native DREAM instruction checkpoint
        run: >-
          python model/evaluate.py
          --checkpoint /tmp/dream-smoke-instruct.pt
          --data /tmp/dream-smoke-data/test.txt
          --batch-size 1 --batches 1 --sample-tokens 8
          --out /tmp/dream-smoke-instruct-eval.json
      - name: Cross-check native DREAM instruction checkpoint and held-out evaluation
        run: >-
          python model/validate_release.py
          --checkpoint /tmp/dream-smoke-instruct.pt
          --audit /tmp/dream-smoke-instruct-checkpoint-audit.json
          --evaluation /tmp/dream-smoke-instruct-eval.json
          --out /tmp/dream-smoke-instruct-release-gate.json
      - name: Confirm instruction technical gate never approves production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/dream-smoke-instruct-release-gate.json").read_text())
          assert report["technical_preflight_passed"] is True
          assert report["production_release_approved"] is False
          print("Instruction checkpoint passed technical preflight; production approval remains false.")
          PY
      - name: Evaluate each language independently on held-out instruction checkpoint
        run: >-
          python model/evaluate_multilingual.py
          --checkpoint /tmp/dream-smoke-instruct.pt
          --manifest /tmp/dream-smoke-data/manifest.json
          --batch-size 1 --batches 1 --sample-tokens 0
          --out /tmp/dream-smoke-instruct-multilingual-eval.json
