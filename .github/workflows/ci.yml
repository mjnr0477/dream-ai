name: Dream AI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run application tests
        run: npm test

  native-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r model/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q model
      - name: Validate Colab notebook structure
        run: python -c "import json; n=json.load(open('training/dream_train_colab.ipynb', encoding='utf-8')); assert n['nbformat']==4 and n['cells'] and all(c['cell_type'] in ('code','markdown') for c in n['cells'])"
      - name: Test DREAM transformer and runtime
        run: python -m unittest discover -s model -p 'test_*.py' -v
      - name: Prepare synthetic pretraining smoke corpus
        run: python model/prepare_corpus.py --input data/smoke-test.jsonl --output /tmp/dream-smoke-data
      - name: Train a tiny DREAM checkpoint from random initialization
        run: >-
          python model/train.py
          --data /tmp/dream-smoke-data/train.txt
          --validation-data /tmp/dream-smoke-data/validation.txt
          --manifest /tmp/dream-smoke-data/manifest.json
          --out /tmp/dream-smoke-small.pt
          --steps 2 --batch-size 2 --grad-accum-steps 1
          --block-size 32 --d-model 16 --layers 1 --heads 4
          --eval-every 1 --checkpoint-every 2 --eval-batches 1
      - name: Evaluate native DREAM checkpoint on held-out test split
        run: >-
          python model/evaluate.py
          --checkpoint /tmp/dream-smoke-small.pt
          --data /tmp/dream-smoke-data/test.txt
          --batch-size 1 --batches 1 --sample-tokens 8
          --out /tmp/dream-smoke-eval.json
      - name: Fine-tune DREAM on synthetic assistant-only examples
        run: >-
          python model/sft.py
          --checkpoint /tmp/dream-smoke-small.pt
          --train-data data/sft-smoke-train.jsonl
          --validation-data data/sft-smoke-validation.jsonl
          --pretraining-manifest /tmp/dream-smoke-data/manifest.json
          --pretraining-test-data /tmp/dream-smoke-data/test.txt
          --out /tmp/dream-smoke-instruct.pt
          --steps 2 --batch-size 1 --grad-accum-steps 1
          --learning-rate 0.0001 --eval-every 1
          --eval-batches 1 --checkpoint-every 2
      - name: Evaluate native DREAM instruction checkpoint
        run: >-
          python model/evaluate.py
          --checkpoint /tmp/dream-smoke-instruct.pt
          --data /tmp/dream-smoke-data/test.txt
          --batch-size 1 --batches 1 --sample-tokens 8
          --out /tmp/dream-smoke-instruct-eval.json
