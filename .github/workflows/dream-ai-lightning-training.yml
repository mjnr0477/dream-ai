name: DREAM AI Lightning GPU training

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: dream-ai-lightning-training
  cancel-in-progress: false

jobs:
  train-adapter:
    if: github.event_name == 'workflow_dispatch' || vars.DREAM_AI_AUTO_TRAINING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and syntax-check the launcher
        run: |
          python -m pip install --disable-pip-version-check lightning-sdk kaggle huggingface_hub
          python -m py_compile training/dream_ai_adapter_self_train_remote.py scripts/launch_dream_ai_lightning.py scripts/publish_dream_reviewed_training_data.py scripts/migrate_dream_kaggle_dataset.py

      - name: Migrate the reviewed dataset once if it is not in the private model store
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          DREAM_AI_KAGGLE_DATASET: ${{ vars.DREAM_AI_KAGGLE_DATASET }}
          DREAM_ADAPTER_REPO: ${{ vars.DREAM_ADAPTER_REPO || 'msjnr0477/dream-ai-adapter' }}
          DREAM_TRAINING_DATASET_PATH: ${{ vars.DREAM_TRAINING_DATASET_PATH || 'training-data/active' }}
        run: python scripts/migrate_dream_kaggle_dataset.py

      - name: Submit bounded T4 training job
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_TEAMSPACE: ${{ secrets.LIGHTNING_TEAMSPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DREAM_AI_GIT_REF: ${{ github.sha }}
          DREAM_ADAPTER_REPO: ${{ vars.DREAM_ADAPTER_REPO || 'msjnr0477/dream-ai-adapter' }}
          DREAM_TRAINING_DATASET_PATH: ${{ vars.DREAM_TRAINING_DATASET_PATH || 'training-data/active' }}
          DREAM_TRAINING_SECONDS: "240"
        run: python scripts/launch_dream_ai_lightning.py

      - name: Report scheduled automation setting
        if: always()
        run: |
          if [ "${{ vars.DREAM_AI_AUTO_TRAINING_ENABLED }}" = "true" ]; then
            echo "Daily Lightning GPU training is enabled."
          else
            echo "Daily training stays disabled until DREAM_AI_AUTO_TRAINING_ENABLED=true is set."
          fi
